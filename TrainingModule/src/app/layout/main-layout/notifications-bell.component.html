<div class="relative">
  <button
    type="button"
    class="relative block rounded-full bg-white-light/40 p-2 hover:bg-white-light/90 hover:text-primary dark:bg-dark/40 dark:hover:bg-dark/60"
    [attr.aria-label]="bellAria"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path
        d="M12 22C13.1 22 14 21.1 14 20H10C10 21.1 10.9 22 12 22ZM18 16V11C18 7.93 16.36 5.36 13.5 4.68V4C13.5 3.17 12.83 2.5 12 2.5C11.17 2.5 10.5 3.17 10.5 4V4.68C7.64 5.36 6 7.92 6 11V16L4 18V19H20V18L18 16Z"
        stroke="currentColor"
        stroke-width="1.25"
        stroke-linejoin="round"
      />
    </svg>
    @if (badgeText(unreadCount()); as badge) {
      <span
        class="absolute -end-1 -top-1 inline-flex min-w-[1.125rem] items-center justify-center rounded-full bg-danger px-1 text-[10px] font-semibold leading-[1.125rem] text-white"
      >
        {{ badge }}
      </span>
    }
  </button>

  @if (open()) {
    <div
      class="absolute end-0 top-full z-50 mt-2 w-[calc(100vw-2rem)] max-w-sm overflow-hidden rounded-xl border border-[#ebedf2] bg-white shadow-lg dark:border-[#191e3a] dark:bg-[#0e1726]"
      role="dialog"
    >
      <div class="flex items-center justify-between gap-2 border-b border-[#ebedf2] px-4 py-3 dark:border-[#191e3a]">
        <span class="font-semibold text-black dark:text-white-light" i18n="@@jobseeker.notificationsInbox.title">My notifications</span>
        <button
          type="button"
          class="text-xs font-semibold text-primary hover:underline disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="unreadCount() === 0"
          (click)="markAllRead()"
          i18n="@@jobseeker.notificationsInbox.markAllRead"
        >
          Mark all as read
        </button>
      </div>

      <ul class="max-h-80 overflow-y-auto">
        @for (n of recent(); track n.Id) {
          <li class="border-b border-[#f0f1f5] last:border-b-0 dark:border-white/5">
            <button
              type="button"
              class="flex w-full items-start gap-3 px-4 py-3 text-start hover:bg-primary/5"
              (click)="markRead(n)"
            >
              <span
                class="mt-1.5 h-2 w-2 shrink-0 rounded-full"
                [class.bg-primary]="!n.IsRead"
                [class.bg-transparent]="n.IsRead"
                aria-hidden="true"
              ></span>
              <span class="min-w-0 flex-1">
                <span class="block truncate text-sm" [class.font-bold]="!n.IsRead" [class.font-medium]="n.IsRead">{{ n.Title }}</span>
                <span class="mt-0.5 line-clamp-2 block whitespace-pre-line text-xs text-white-dark">{{ n.Body }}</span>
                <span class="mt-1 block text-[11px] text-white-dark">{{ formatDate(n.CreatedAtUtc) }}</span>
              </span>
            </button>
          </li>
        } @empty {
          <li class="px-4 py-6 text-center text-sm text-white-dark">
            @if (loadingRecent()) {
              <span i18n="@@jobseeker.common.loading">Loading…</span>
            } @else {
              <span i18n="@@jobseeker.notificationsInbox.empty">No notifications</span>
            }
          </li>
        }
      </ul>

      <div class="border-t border-[#ebedf2] px-4 py-2 text-center dark:border-[#191e3a]">
        <button type="button" class="text-sm font-semibold text-primary hover:underline" (click)="viewAll()" i18n="@@jobseeker.notificationsInbox.viewAll">
          View all
        </button>
      </div>
    </div>
  }
</div>
